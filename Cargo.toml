[workspace]
resolver = "2"
members = [
    "crates/core",
    "src-tauri",
]

[workspace.package]
# 애플리케이션 버전·제작자의 **단일 소스**.
#   crates/core·src-tauri(CARGO_PKG_VERSION/AUTHORS) → store::app_meta()
#   → IPC `get_app_meta` → UI About/설정 표시
# tauri.conf.json / package.json 도 같은 값을 유지해야 한다(scripts/verify-app-meta.mjs 가 검증).
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["uptodatelabs"]

[workspace.dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
urlencoding = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = { version = "2", features = [] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
